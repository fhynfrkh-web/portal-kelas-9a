<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- =========================================================
     PORTAL KELAS 9A — HTML (tempel di panel HTML CodePen)
     ========================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css">
<!-- Pustaka: database online (Lovable Cloud) + ikon modern -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<!-- ===== SPLASH SCREEN ===== -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-inner">
    <div class="splash-logo"><i data-lucide="graduation-cap"></i></div>
    <p class="splash-title" id="splashTitle">PORTAL KELAS</p>
    <h1 class="splash-class" id="splashClass">9A</h1>
    <p class="splash-tag" id="splashTag">“Satu portal untuk semua informasi kelas 9A.”</p>
    <div class="splash-loader"><span></span></div>
  </div>
</div>

<!-- ===== APLIKASI ===== -->
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn topbar-menu" data-action="open-drawer" aria-label="Buka menu">
      <i data-lucide="menu"></i>
    </button>
    <div class="brand">
      <div class="brand-logo"><i data-lucide="graduation-cap"></i></div>
      <div class="brand-text">
        <strong id="brandName">PORTAL KELAS 9A</strong>
        <small id="brandSub">Informasi kelas dalam satu tempat</small>
      </div>
    </div>
    <div class="topbar-right">
      <span class="conn" id="conn" title="Status koneksi"><span class="conn-dot"></span><span class="conn-text">Menghubungkan…</span></span>
      <button class="icon-btn" data-action="toggle-theme" aria-label="Ganti tema" id="themeBtn">
        <i data-lucide="moon"></i>
      </button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Menu navigasi">
    <div class="sidebar-head">
      <strong>Menu</strong>
      <button class="icon-btn" data-action="close-drawer" aria-label="Tutup menu"><i data-lucide="x"></i></button>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="sidebar-foot">
      <p>“Satu portal untuk semua informasi kelas.”</p>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" data-action="close-drawer"></div>

  <main class="main">
    <div id="view" class="view"></div>
  </main>

  <nav class="bottomnav" id="bottomNav" aria-label="Navigasi bawah"></nav>
</div>

<!-- ===== MODAL & NOTIFIKASI ===== -->
<div class="modal-wrap" id="modal" aria-hidden="true">
  <div class="modal-backdrop" data-action="close-modal"></div>
  <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden />

    
</body>
</html>
